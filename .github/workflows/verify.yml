name: Verify engineering workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa
      - run: uv sync --locked --python 3.12
      - name: Run fast tests (hang-guarded)
        env:
          PYTEST_HANG_SECONDS: 240
        run: uv run pytest -q --disable-warnings --ignore=tests/test_pcb.py -k "not kicad and not pcb and not board_envelope and not breakout and not production_assembly and not multi_revision and not benchmark_names"
      - run: uv run python -m scripts.benchmark
      - run: node --input-type=module --check < web/app.js
      - run: uv run python scripts/check_artifacts.py

  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa xvfb
      - name: Install KiCad for pcbnew
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          PCBNEW_DIR=$(find /usr/lib/python3* /usr/lib/kicad -name 'pcbnew*' -exec dirname {} \; 2>/dev/null | sort -u | head -1)
          if [ -z "$PCBNEW_DIR" ]; then
            PCBNEW_DIR=$(find /usr/lib -path '*/pcbnew*' -exec dirname {} \; 2>/dev/null | sort -u | head -1)
          fi
          echo "PCBNEW_DIR=$PCBNEW_DIR" >> $GITHUB_ENV
          echo "AUTOCADENT_KICAD_PYTHON=/usr/bin/python3" >> $GITHUB_ENV
          # NOTE: Do NOT export PYTHONPATH here — it would leak into the uv/pytest
          # process and let old system packages (e.g. typing_extensions) shadow venv ones.
          # Instead, test helpers pass PYTHONPATH=PCBNEW_DIR only to the /usr/bin/python3
          # subprocess that runs model_board.py.
          # sitecustomize.py for the pre-sync verification step only.
          if [ -n "$PCBNEW_DIR" ]; then
            SITE_DIR=$(python3 -c "import site; print([p for p in site.getsitepackages() if 'dist-packages' in p][0])")
            printf 'import sys\nsys.path.insert(0, "%s")\n' "$PCBNEW_DIR" | sudo tee "$SITE_DIR/sitecustomize.py"
          fi
      - name: Start virtual display for KiCad/wxWidgets
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - run: /usr/bin/python3 -c "import pcbnew; print('pcbnew OK:', pcbnew.__file__)"
      - run: uv sync --locked --python 3.12
      - name: Run slow learning-loop tests (hang-guarded)
        env:
          PYTEST_HANG_SECONDS: 1500
        run: |
          # Collect matching tests; skip gracefully if none exist on this branch
          COLLECTED=$(uv run pytest --collect-only -q --disable-warnings -k "multi_revision or production_assembly or benchmark_names" 2>&1)
          COUNT=$(echo "$COLLECTED" | grep -c "::test_" || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No slow learning tests found on this branch — skipping."
            exit 0
          fi
          uv run pytest -q --disable-warnings -k "multi_revision or production_assembly or benchmark_names"

  kicad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa xvfb
      - name: Install KiCad for pcbnew
        run: |
          # Retry PPA addition — Launchpad API occasionally returns 504 Gateway Timeout
          for i in 1 2 3; do
            echo "Attempt $i to add KiCad PPA..."
            if sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases; then
              echo "PPA added successfully"
              break
            fi
            if [ $i -lt 3 ]; then
              echo "PPA addition failed, retrying in 10s..."
              sleep 10
            else
              echo "Failed to add PPA after 3 attempts"
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install -y kicad
          PCBNEW_DIR=$(find /usr/lib/python3* /usr/lib/kicad -name 'pcbnew*' -exec dirname {} \; 2>/dev/null | sort -u | head -1)
          if [ -z "$PCBNEW_DIR" ]; then
            PCBNEW_DIR=$(find /usr/lib -path '*/pcbnew*' -exec dirname {} \; 2>/dev/null | sort -u | head -1)
          fi
          echo "PCBNEW_DIR=$PCBNEW_DIR" >> $GITHUB_ENV
          echo "AUTOCADENT_KICAD_PYTHON=/usr/bin/python3" >> $GITHUB_ENV
          # NOTE: Do NOT export PYTHONPATH here — it would leak into the uv/pytest
          # process and let old system packages (e.g. typing_extensions) shadow venv ones.
          # Instead, test helpers pass PYTHONPATH=PCBNEW_DIR only to the /usr/bin/python3
          # subprocess that runs model_board.py.
          # sitecustomize.py for the pre-sync verification step only.
          if [ -n "$PCBNEW_DIR" ]; then
            SITE_DIR=$(python3 -c "import site; print([p for p in site.getsitepackages() if 'dist-packages' in p][0])")
            printf 'import sys\nsys.path.insert(0, "%s")\n' "$PCBNEW_DIR" | sudo tee "$SITE_DIR/sitecustomize.py"
          fi
      - name: Start virtual display for KiCad/wxWidgets
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - run: /usr/bin/python3 -c "import pcbnew; print('pcbnew OK:', pcbnew.__file__)"
      - run: uv sync --locked --python 3.12
      - name: Run KiCad + full tests (hang-guarded, slow learning tests in learning job)
        env:
          PYTEST_HANG_SECONDS: 1500
        run: uv run pytest -q --disable-warnings -k "not multi_revision and not production_assembly and not benchmark_names"
      - run: uv run python -m scripts.benchmark
      - run: node --input-type=module --check < web/app.js
      - run: uv run python scripts/check_artifacts.py
