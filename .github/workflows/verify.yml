name: Verify engineering workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa
      - name: Install KiCad for pcbnew
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          # pcbnew may be pcbnew.py, pcbnew.pyi, or _pcbnew*.so depending on KiCad version.
          PCBNEW_DIR=$(find /usr/lib/python3* /usr/lib/kicad -name 'pcbnew*' -exec dirname {} \; 2>/dev/null | sort -u | head -1)
          if [ -z "$PCBNEW_DIR" ]; then
            PCBNEW_DIR=$(find /usr/lib -path '*/pcbnew*' -exec dirname {} \; 2>/dev/null | sort -u | head -1)
          fi
          echo "PCBNEW_DIR=$PCBNEW_DIR"
          echo "AUTOCADENT_KICAD_PYTHON=/usr/bin/python3" >> $GITHUB_ENV
          # PYTHONPATH is inherited by /usr/bin/python3 subprocesses spawned from uv run pytest.
          # uv run sets PYTHONHOME which overrides system Python's site-packages; PYTHONPATH
          # survives that override and ensures pcbnew is found regardless.
          if [ -n "$PCBNEW_DIR" ]; then
            echo "PYTHONPATH=$PCBNEW_DIR" >> $GITHUB_ENV
          fi
          # sitecustomize.py as fallback for direct system Python invocations.
          if [ -n "$PCBNEW_DIR" ]; then
            SITE_DIR=$(python3 -c "import site; print([p for p in site.getsitepackages() if 'dist-packages' in p][0])")
            printf 'import sys\nsys.path.insert(0, "%s")\n' "$PCBNEW_DIR" | sudo tee "$SITE_DIR/sitecustomize.py"
          fi
      - run: /usr/bin/python3 -c "import pcbnew; print('pcbnew OK:', pcbnew.__file__)"
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q --disable-warnings
      - run: uv run python -m scripts.benchmark
      - run: node --input-type=module --check < web/app.js
      - run: uv run python scripts/check_artifacts.py
